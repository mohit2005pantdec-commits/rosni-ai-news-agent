<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosni News - Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .log-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }
    .log-table th, .log-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }
    .log-table th {
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .log-table tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="background-mesh"></div>
  <header class="glass-header">
    <div class="logo">
      <span class="logo-icon">🌿</span>
      <h1>Rosni News Agent</h1>
    </div>
    <nav class="nav-links">
      <a href="/">Review</a>
      <a href="/published.html">Published</a>
      <a href="/notifications.html" class="active">Notifications</a>
    </nav>
  </header>
  <main>
    <div class="container">
      <div class="news-card" style="padding: 1.5rem;">
        <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Notification Logs</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">
          This log tracks mock notifications generated when an article is published. Ready to connect to Firebase/SMS in the future.
        </p>
        <div id="logs-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Fetching logs...</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="notifications.js"></script>
</body>
</html>
